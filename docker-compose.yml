
version: '3.8'

services:
  # BASE DE DONNÉES 
  postgres:
    image: postgres:15-alpine
    container_name: oncoscan_db_v2
    restart: always
    environment:
      POSTGRES_DB: oncoscan
      POSTGRES_USER: oncoscan
      POSTGRES_PASSWORD: oncoscan_secure_password
    ports:
      - "5432:5432"
    volumes:
      # Initialisation automatique du schéma de production au premier démarrage
      - ./Database/init_modif.sql:/docker-entrypoint-initdb.d/init.sql
      # Persistance locale des données 
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oncoscan_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oncoscan -d oncoscan"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # API 
  api:
    build:
      context: .
      dockerfile: ./Api/Dockerfile
    image: schaphath/oncoscan-api:v2.0
    container_name: oncoscan_api_v2
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_NAME=oncoscan
      - DB_USER=oncoscan
      - DB_PASSWORD=oncoscan_secure_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oncoscan_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s 

  # INTERFACE WEB
  interface:
    build:
      context: .
      dockerfile: ./Interface/Dockerfile
    image: schaphath/oncoscan-interface:v2.0
    container_name: oncoscan_interface_v2
    restart: always
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000/predict
    depends_on:
      api:
        condition: service_healthy
    networks:
      - oncoscan_net

# VOLUMES ET RÉSEAUX ISOLÉS
volumes:
  postgres_data:
    name: oncoscan_production_data

networks:
  oncoscan_net:
    driver: bridge

    