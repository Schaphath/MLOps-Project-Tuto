name: CI/CD OncoScan AI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  
jobs:

  # =============================================================================
  # ÉTAPE 1 : ARTEFACTS & VALIDATION (Qualité & Intégrité)
  # =============================================================================
  artefacts:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      # Vérification de la syntaxe du code dans les bons répertoires
      - name: vérifier code API
        run: flake8 Api/api_modif.py --max-line-length=120 --ignore=E501,W503

      - name: vérifier code interface
        run: flake8 Interface/interface.py --max-line-length=120 --ignore=E501,W503

      # Sécurité MLOps : Intercepter l'absence des modèles avant les tests et le build
      - name: Vérifier les artefacts du modèle
        run: |
          if [ ! -f "Save_models/xgboost_best.pkl" ] || [ ! -f "Save_models/MinMax_scaler.pkl" ]; then
            echo "Les fichiers xgboost_best.pkl ou MinMax_scaler.pkl sont manquants dans le dossier Save_models/."
            exit 1
          fi
          echo "Modèle XGBoost et Scaler validés."


  # =============================================================================
  # ÉTAPE 2 : TESTS UNITAIRES & INTEGRATION (Conteneur Postgres éphémère)
  # =============================================================================
  test:
    needs: artefacts
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: oncoscan_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_secure_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oncoscan_db"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Optimisation du temps d'exécution via la mise en cache des packages pip
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements-prod.txt', 'requirements-streamlit.txt') }}
          restore-keys: |
            pip-

      # Installation des dépendances applicatives et de test
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-prod.txt ]; then pip install -r requirements-prod.txt; fi
          if [ -f requirements-streamlit.txt ]; then pip install -r requirements-streamlit.txt; fi
          pip install pytest httpx pytest-asyncio

      # Initialisation de la structure de données pour les tests d'intégration
      - name: initialisation BD
        env:
          PGPASSWORD: postgres_secure_password
        run: |
          if [ -f Database/init_modif.sql ]; then
            psql -h localhost -U postgres -d oncoscan_db -f Database/init_modif.sql
          else
            echo "Fichier Database/init_modif.sql introuvable."
          fi

      # Exécution des suites de tests Pytest (API + Modèle ML)
      - name: Run Pytest Suite
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: oncoscan_db
          DB_USER: postgres
          DB_PASSWORD: postgres_secure_password
        run: |
          mkdir -p Tests_results
          pytest tests/ -v --junitxml=Tests_results/integration-results.xml
          pytest Tests/test_model.py -v --junitxml=Tests_results/model-results.xml 
          
      # Sauvegarde des rapports sur GitHub, même si un test échoue
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Tests_results/


  # =============================================================================
  # ÉTAPE 3 : COMPILATION & LIVRAISON (Docker Hub - Uniquement sur Main)
  # =============================================================================
  build-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Génération du Short SHA (7 premiers caractères du commit) pour le versioning précis
      - name: Set image tag (Short SHA)
        id: tag
        run: echo "SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      # Construction et Push de l'API FastAPI
      - name: Build and Push API (FastAPI)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oncoscan-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/oncoscan-api:${{ steps.tag.outputs.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Construction et Push de l'Interface Streamlit
      - name: Build and Push Streamlit Interface
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Interface/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/oncoscan-streamlit:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/oncoscan-streamlit:${{ steps.tag.outputs.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # =============================================================================
  # ÉTAPE 4 : NOTIFICATION ET RÉSUMÉ DE PIPELINE
  # =============================================================================
  notify:
    needs: [artefacts, test, build-push]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Résumé exécutif
        run: |
          echo "=== RÉSUMÉ DU PIPELINE GITHUB ACTIONS ==="
          echo "Commit ID : $GITHUB_SHA"
          echo "Branche   : $GITHUB_REF_NAME"
          echo "Vérifications de code et déploiement Docker Hub complétés."
          
